# Always combine with docker-compose.yml and an explicitly supplied production env file.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong production database password}
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong production database password}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set a random Base64 encoded secret of at least 32 bytes}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set the public HTTPS origin}
  frontend:
    build:
      args:
        VITE_API_BASE_URL: /api
