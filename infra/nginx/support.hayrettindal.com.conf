# Host Nginx config example for Ubuntu server.
# Keep your personal website block untouched and add this as a new file.
# Obtain the certificate first (e.g. Certbot); validate with nginx -t before reload.

limit_req_zone $binary_remote_addr zone=support_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=support_api:10m rate=20r/s;

server {
    listen 80;
    server_name support.hayrettindal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name support.hayrettindal.com;
    ssl_certificate /etc/letsencrypt/live/support.hayrettindal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.hayrettindal.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Locations inherit all headers: do not add location-level add_header directives.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_read_timeout 30s;
    limit_req_status 429;

    location = /api/v1/auth/login {
        limit_req zone=support_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(actuator|v3/api-docs|swagger-ui)(/|$|\.html$) {
        return 404;
    }

    location /api/ {
        limit_req zone=support_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
