name: CI-CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this tested main commit to production
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: docker run --rm --network none -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --log-opts=--all

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Back-end tests
        working-directory: backend
        run: mvn -B verify

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Front-end build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=high

      - name: Docker compose config check
        env:
          POSTGRES_PASSWORD: ci-placeholder-password
          APP_JWT_SECRET: ci-placeholder-only-not-a-production-secret
          APP_CORS_ALLOWED_ORIGINS: https://example.com
        run: |
          docker compose -f infra/docker-compose.yml config --quiet
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml config --quiet
          for script in infra/scripts/*.sh; do bash -n "$script"; done

      - name: Verify container builds
        run: docker compose -f infra/docker-compose.yml build

  cd:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Check deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_FINGERPRINT: ${{ secrets.DEPLOY_FINGERPRINT }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_FINGERPRINT" || {
            echo 'Configure the four production deployment secrets.' >&2
            exit 1
          }
      - name: Deploy on Ubuntu server through SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          envs: DEPLOY_SHA
          command_timeout: 20m
          script: |
            set -eu
            cd /opt/b2b-support
            test -f .env.production
            test -z "$(git status --porcelain)"
            git fetch origin main
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
            git checkout --detach "$DEPLOY_SHA"
            bash infra/scripts/deploy.sh "$DEPLOY_SHA"
